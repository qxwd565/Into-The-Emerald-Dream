name: Normalize HSdeck dated card API
on:
  push:
    paths:
      - '.github/workflows/migrate-to-dates-v1.yml'
      - 'data/**'
      - 'cards.json'
      - 'release-policy.json'
      - 'tools/dated-migration-dates.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dates-v1-into-the-emerald-dream-main
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch pinned HSdeck date converter
        run: |
          mkdir -p /tmp/hsdeck-dated
          curl -fsSL --retry 3 'https://raw.githubusercontent.com/qxwd565/legacy/733f4fb359732b0a3599029387082e968d77010a/tools/convert-to-dates-v1.py' -o /tmp/hsdeck-dated/convert.py
      - name: Convert verified first-use dates and check every card
        run: |
          python /tmp/hsdeck-dated/convert.py --root . --strict
          python /tmp/hsdeck-dated/convert.py --root . --strict --check
          git diff --check
      - name: Commit only original card date documents
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u -- data/
          if ! git diff --cached --quiet; then
            git commit -m 'Unify Into-The-Emerald-Dream dated card records [skip ci]'
            git push origin HEAD:main
          fi
